<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Emerald Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0f382c"/>
      <stop offset="100%" stop-color="#051a13"/>
    </radialGradient>

    <!-- Metallic Gold/Champagne Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7ce"/>
      <stop offset="30%" stop-color="#e5c158"/>
      <stop offset="70%" stop-color="#c49a37"/>
      <stop offset="100%" stop-color="#9a7322"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Favicon Container / Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Icon Geometry: Monogram Intertwined FF Mark -->
  <g filter="url(#shadow)" fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Primary Flow (Outer Ribbon F) -->
    <path d="M 160 360 L 160 172 C 160 140, 186 120, 220 120 L 340 120" stroke-width="44"/>
    <path d="M 160 236 L 300 236" stroke-width="44"/>

    <!-- Interlocking Flow (Inner Ribbon F) -->
    <path d="M 236 392 L 236 280 C 236 255, 255 236, 280 236 L 352 236" stroke-width="36" stroke-opacity="0.9"/>
    <path d="M 236 328 L 320 328" stroke-width="36" stroke-opacity="0.9"/>

    <!-- Accent Thread Loop (Fashion Stitch Touch) -->
    <circle cx="340" cy="120" r="10" fill="url(#goldGrad)" stroke="none"/>
  </g>
</svg>